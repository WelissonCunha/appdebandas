<div class="linha"><label style="display:flex;align-items:center;cursor:pointer"><input type="checkbox" name="ids" value="{{ ev.pk }}" form="form-lote" aria-label="Selecionar"></label>
<div class="info"><a href="{% url 'evento' ev.pk %}"><b>{{ ev.titulo }}</b></a> <span class="tag">{{ ev.get_tipo_display }}</span>
<div class="mut">{{ ev.data_hora|date:"d/m/Y H:i" }} · {{ ev.banda }}{% if ev.local %} · {{ ev.local }}{% endif %}</div></div>
<div class="acoes"><a class="mini" href="{% url 'evento_editar' ev.pk %}">✏️ Editar</a>
<form class="inl" method="post" action="{% url 'evento_excluir' ev.pk %}" onsubmit="return confirm('Excluir {{ ev.titulo|escapejs }}? A escala e o setlist dele também serão apagados.')">{% csrf_token %}<button class="no">🗑️</button></form></div></div>

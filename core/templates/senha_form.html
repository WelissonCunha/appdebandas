{% extends "base.html" %}{% block content %}
<style>.fm p{margin:0 0 10px}.fm input{width:100%;padding:8px;border-radius:8px;border:1px solid #8884;font:inherit}.helptext{display:block;color:var(--mut);font-size:.85rem}</style>
<div class="card fm"><h2>🔑 Alterar minha senha</h2>
{% if forcado %}<p><b>Por segurança, defina uma nova senha para continuar.</b> Em "senha atual", use a que você recebeu.</p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Salvar</button> {% if not forcado %}<a href="{% url 'home' %}">Cancelar</a>{% endif %}</form></div>
{% endblock %}
